[package]
name = "ym2151-log-editor"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
arboard = "3.6.1"
clap = { version = "4", features = ["derive"] }
cat-self-update-lib = { git = "https://github.com/cat2151/cat-self-update", package = "cat-self-update-lib" }
unicode-width = "0.2"

[target.'cfg(windows)'.dependencies]
ym2151-log-play-server = { git = "https://github.com/cat2151/ym2151-log-play-server" }
